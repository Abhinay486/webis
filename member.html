<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Member details for the Class of 10th directory." />
  <title>Member Details | Class of 10th</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#f7f8fa] text-slate-900 antialiased">
  <main class="mx-auto max-w-6xl px-5 py-6 sm:px-8 lg:px-10 lg:py-10">
    <a href="index.html" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-500 transition hover:text-orange-600">&larr; Back to all members</a>
    <section data-member-profile class="mt-10 grid gap-8 lg:grid-cols-[minmax(280px,420px)_1fr] lg:gap-14">
      <div><img data-member-image class="aspect-square w-full rounded-3xl object-cover shadow-xl shadow-slate-200" src="" alt="" /></div>
      <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm sm:p-9">
        <p class="mb-3 text-xs font-bold uppercase tracking-[0.2em] text-orange-600">Classmate profile</p>
        <h1 data-member-name class="text-4xl font-black tracking-tight text-slate-950 sm:text-5xl"></h1>
        <p data-member-subtitle class="mt-3 text-base text-slate-500"></p>
        <div class="my-8 grid gap-x-6 gap-y-6 border-y border-slate-100 py-7 sm:grid-cols-2">
          <div><p class="text-[11px] font-bold uppercase tracking-[0.16em] text-slate-400">Date of birth</p><p data-member-dob class="mt-1 font-semibold text-slate-900"></p></div>
          <div><p class="text-[11px] font-bold uppercase tracking-[0.16em] text-slate-400">Residence</p><p data-member-residence class="mt-1 font-semibold text-slate-900"></p></div>
          <div><p class="text-[11px] font-bold uppercase tracking-[0.16em] text-slate-400">Working as</p><p data-member-occupation class="mt-1 font-semibold text-slate-900"></p></div>
          <div><p class="text-[11px] font-bold uppercase tracking-[0.16em] text-slate-400">Contact no</p><p data-member-phone class="mt-1 font-semibold text-slate-900"></p></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <a data-call-link href="#" class="rounded-full bg-slate-950 px-3 py-3 text-center text-sm font-bold text-white transition hover:bg-orange-600">Call</a>
          <a data-whatsapp-link href="#" target="_blank" rel="noreferrer" class="rounded-full bg-slate-950 px-2 py-3 text-center text-sm font-bold text-white transition hover:bg-orange-600">WhatsApp</a>
        </div>
      </div>
    </section>
    <section data-empty-member class="mt-16 hidden rounded-3xl border border-dashed border-slate-300 bg-white px-6 py-16 text-center"><h1 class="text-2xl font-bold">Member not found</h1><p class="mt-2 text-slate-500">This profile may have moved. Return to the directory to browse all members.</p><a href="index.html" class="mt-6 inline-block rounded-full bg-slate-950 px-5 py-3 text-sm font-bold text-white">View all members</a></section>
  </main>
  <script src="mockData.js"></script>
  <script src="app.js"></script>
</body>
</html>
